# ─────────────────────────────────────────────────────────────
# CAR – Continuous Integration
#
# Triggers: push / PR to master and staging
#
# Jobs:
#   1. unit-tests    – fast, no DB, pure unittest.TestCase tests
#   2. django-tests  – needs Postgres, runs django.test.TestCase tests
#   3. lint          – flake8 style checks
#   4. build-push    – build, scan, and push to Docker Hub (master push only)
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOBS
# ============================================================
jobs:

  # ----------------------------------------------------------
  # 1. Unit tests (no database required)
  #    Covers: chem_utils, conversions, validate, otsession,
  #            otwriter, tasks, pubchem_utils,
  #            db_utils, createmodels, signals, serializers
  # ----------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.15.2-slim-bookworm

    steps:
      - name: Install native build dependencies and create venv
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y \
            git build-essential libpq-dev
          apt-get clean
          python -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/opt/venv" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        working-directory: src
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.txt
          python -m pip check

      - name: Run unit tests
        working-directory: src
        env:
          DJANGO_SETTINGS_MODULE: CAR.settings
          # Provide dummy env vars so settings.py can import without error.
          # These are NOT used — unit tests mock all DB/service calls.
          SECRET_KEY: ci-test-secret-key-not-real
          SENDGRID_API_KEY: SG.dummy
          POSTGRES_NAME: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # API keys required at module import time (not actually called in tests)
          MANIFOLD_API_KEY: dummy
          ENAMINE_REAL_TOOLS_API_KEY: dummy
          IBM_API_KEY: dummy
          MCULE_API_KEY: dummy
        run: |
          mkdir -p logs && touch logs/logfile.log
          python3 -m django test backend.tests.test_chem_utils \
                                  backend.tests.test_conversions \
                                  backend.tests.test_validate \
                                  backend.tests.test_otsession \
                                  backend.tests.test_otwriter \
                                  backend.tests.test_tasks \
                                  backend.tests.test_pubchem_utils \
                                  backend.tests.test_db_utils \
                                  backend.tests.test_createmodels \
                                  backend.tests.test_signals \
                                  backend.tests.test_serializers \
                                  --verbosity 2 --no-input

  # ----------------------------------------------------------
  # 2. Django integration tests (requires Postgres)
  #    Covers: test_api, test_recipe_models, test_recipe_utils,
  #            test_recipegenerator
  # ----------------------------------------------------------
  django-tests:
    runs-on: ubuntu-latest
    container:
      image: python:3.15.2-slim-bookworm

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: car_test
          POSTGRES_USER: car_ci
          POSTGRES_PASSWORD: car_ci_password
        options: >-
          --health-cmd "pg_isready -U car_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install native build dependencies and create venv
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y \
            git build-essential libpq-dev
          apt-get clean
          python -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=/opt/venv" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        working-directory: src
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.txt
          python -m pip check

      - name: Run Django integration tests
        working-directory: src
        env:
          DJANGO_SETTINGS_MODULE: CAR.settings
          SECRET_KEY: ci-test-secret-key-not-real
          SENDGRID_API_KEY: SG.dummy
          POSTGRES_NAME: car_test
          POSTGRES_USER: car_ci
          POSTGRES_PASSWORD: car_ci_password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # API keys required at module import time (not actually called in tests)
          MANIFOLD_API_KEY: dummy
          ENAMINE_REAL_TOOLS_API_KEY: dummy
          IBM_API_KEY: dummy
          MCULE_API_KEY: dummy
        run: |
          mkdir -p logs && touch logs/logfile.log
          python3 -m django test backend.tests.test_api \
                                  backend.tests.test_recipe_models \
                                  backend.tests.test_recipe_utils \
                                  backend.tests.test_recipegenerator \
                                  --verbosity 2 --no-input

  # ----------------------------------------------------------
  # 3. Lint (flake8)
  # ----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install flake8
        run: python -m pip install flake8==7.5.0

      - name: Run flake8
        working-directory: src
        run: |
          flake8 backend/ \
            --max-line-length 120 \
            --exclude '__pycache__,migrations,encodedrecipes.py' \
            --count --statistics \
            --extend-ignore E114,E128,E261,E302,E303,E305,E306,E402,E501,E712,E722,W291,W292,W293,W391,W503,W605,E203,F401,F541,F811,F841

  # ----------------------------------------------------------
  # 4. Build, scan & push Docker image
  #    Only runs on push (not PRs) and only after tests pass.
  #    Tags: latest and sha-<commit>
  # ----------------------------------------------------------
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [unit-tests, django-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile.prod
          load: true
          tags: car:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: car:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push scanned image
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          repo="${DOCKER_HUB_USERNAME}/car"
          docker tag car:ci "${repo}:latest"
          docker tag car:ci "${repo}:sha-${COMMIT_SHA:0:7}"
          docker push "${repo}:latest"
          docker push "${repo}:sha-${COMMIT_SHA:0:7}"
